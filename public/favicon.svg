<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0d0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f85c3a"/>
      <stop offset="50%" stop-color="#ff7a5c"/>
      <stop offset="100%" stop-color="#d94a2c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Chamfer Rounded Shield Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)" stroke="#f85c3a" stroke-width="8" stroke-opacity="0.3"/>

  <!-- Cybernetic Hex / Shield Geometry -->
  <g filter="url(#glow)">
    <polygon points="256,76 396,156 396,316 256,416 116,316 116,156" 
             fill="none" 
             stroke="url(#cyberGrad)" 
             stroke-width="16" 
             stroke-linejoin="miter" 
             stroke-miterlimit="4"/>
    
    <!-- Central Monogram Core C & Shield Nodes -->
    <path d="M 310,180 C 230,170 190,210 190,256 C 190,302 230,342 310,332" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="24" 
          stroke-linecap="round"/>
          
    <circle cx="256" cy="256" r="18" fill="#f85c3a"/>
    <circle cx="256" cy="76" r="10" fill="#ffffff"/>
    <circle cx="396" cy="156" r="10" fill="#f85c3a"/>
    <circle cx="396" cy="316" r="10" fill="#ffffff"/>
    <circle cx="256" cy="416" r="10" fill="#f85c3a"/>
    <circle cx="116" cy="316" r="10" fill="#ffffff"/>
    <circle cx="116" cy="156" r="10" fill="#f85c3a"/>
  </g>
</svg>
